        checkOut: `${checkOutH}:${String(checkOutM).padStart(2,'0')}`,
        status: 'Present',
        overtimeHours: Math.round(overtime*100)/100,

const Store = {

// ==================== TAX CALCULATION ENGINE ====================
const TaxEngine = {
  calculate(emp) {
    const basic = emp.basicSalary;
    const allowances = (emp.houseRent||0) + (emp.transportAllowance||0) + (emp.medicalAllowance||0) + (emp.foodAllowance||0) + (emp.otherAllowance||0);
    const grossSalary = basic + allowances;

    // Deductions from gross (non-taxable)
    const epfEmployee = emp.pfType === 'EPF' ? Math.round(basic * (emp.epfRate||10) / 100) : Math.round(basic * 0.10);
    const ssfEmployee = emp.pfType === 'SSF' ? Math.round(basic * 0.10) : 0;
    const totalPF = epfEmployee + ssfEmployee;
    const lifeIns = Math.min(emp.lifeInsurance || 0, MAX_LIFE_INS);
    const healthIns = Math.min(emp.healthInsurance || 0, MAX_HEALTH_INS);
    const cit = Math.min(emp.citDeposit || 0, MAX_CIT);

    // Women's deduction
    const womenDed = emp.gender === 'Female' ? WOMEN_DEDUCTION : 0;

    // Taxable income (annual)
    const monthlyTaxable = grossSalary - totalPF - lifeIns - healthIns - cit - womenDed;
    const annualTaxable = Math.max(0, monthlyTaxable * 12);

    // Tax calculation
    let tax = 0;
    let remaining = annualTaxable;
    const slabBreakdown = [];
    for(const slab of TAX_SLABS) {
      if(remaining <= 0) break;
      const taxableInSlab = Math.min(remaining, slab.max === Infinity ? remaining : slab.max - slab.min + 1);
      const taxInSlab = Math.round(taxableInSlab * slab.rate);
      tax += taxInSlab;
      slabBreakdown.push({ ...slab, taxableAmount: taxableInSlab, taxAmount: taxInSlab });
      remaining -= taxableInSlab;
    }

    const monthlyTax = Math.round(tax / 12);
    const epfEmployer = emp.pfType === 'EPF' ? Math.round(basic * (emp.epfRate||10) / 100) : Math.round(basic * 0.0933);
    const netSalary = grossSalary - totalPF - monthlyTax;

    return {
      basicSalary: basic,
      allowances,
      grossSalary,
      epfEmployee, ssfEmployee, totalPF,
      epfEmployer,
      lifeIns, healthIns, cit, womenDed,
      monthlyTaxable,
      annualTaxable,
      totalAnnualTax: tax,
      monthlyTax,
      tds: monthlyTax,
      netSalary,
      slabBreakdown
    };
  }
};

// ==================== GRATUITY CALCULATION ====================
const GratuityEngine = {
  calculate(emp) {
    const joining = new Date(emp.joiningDate);
    const now = new Date();
    const years = Math.max(0, (now - joining) / (1000*60*60*24*365.25));
    if(years < 1) return { eligible: false, years: years.toFixed(1), amount: 0 };
    // Per Labour Act 2074: (Last basic salary / 30) * 15 * years of service
    const dailyRate = emp.basicSalary / 30;
    const gratuity = dailyRate * 15 * years;
    return { eligible: true, years: years.toFixed(1), dailyRate, gratuity: Math.round(gratuity) };
  }
};

// ==================== LEAVE ENGINE ====================
const LeaveEngine = {
  getBalance(emp) {
    const used = emp.leaveUsed || {};
    const balance = {};
    for(const [key, config] of Object.entries(LEAVE_TYPES)) {
      if(key === 'maternity' && emp.gender !== 'Female') { balance[key] = 0; continue; }
      if(key === 'paternity' && emp.gender !== 'Male') { balance[key] = 0; continue; }
      if(key === 'publicHoliday') { balance[key] = config.days; continue; }
      balance[key] = Math.max(0, config.days - (used[key] || 0));
    }
    return balance;
  },
  getTotalLeaveDays(start, end) {
    const s = new Date(start), e = new Date(end);
    let count = 0;
    const cur = new Date(s);
    while(cur <= e) {
      if(cur.getDay() !== 0 && cur.getDay() !== 6) count++;
      cur.setDate(cur.getDate()+1);
    }
    return count;
  }
};
